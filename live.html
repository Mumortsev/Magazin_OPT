<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F5F0E8">
    <title>Курортник - Оптовый магазин</title>
    <link rel="stylesheet" href="css/styles_new.css?v=10.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
    <script>
        console.log('%c VERSION CHECK: 3.92 (FIXED UI) ', 'background: #222; color: #bada55; font-size: 20px');
    </script>
    <div id="debug-console"
        style="position:fixed; bottom:0; left:0; right:0; background:rgba(0,0,0,0.8); color:red; font-size:12px; padding:10px; z-index:9999; max-height:150px; overflow:auto; display:none;">
    </div>
    <script>
        window.onerror = function (msg, url, line) {
            var d = document.getElementById('debug-console');
            d.style.display = 'block';
            d.innerHTML += 'E: ' + msg + ' (' + line + ')<br>';
            return false;
        };
        window.addEventListener('unhandledrejection', function (e) {
            var d = document.getElementById('debug-console');
            d.style.display = 'block';
            d.innerHTML += 'UR: ' + e.reason + '<br>';
        });
    </script>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <!-- Header items in one row -->
            <div class="header-top">
                <!-- Catalog Button Left -->
                <div class="logo-container">
                    <button id="headerCatalogBtn" class="header-catalog-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" style="margin-right: 8px;">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        Каталог
                    </button>
                </div>

                <!-- Search Right -->
                <div class="search-container" id="searchContainer"
                    style="margin-left: 12px; margin-bottom: 0; flex: 1;">
                    <input type="text" class="search-input" id="searchInput" placeholder="Поиск">
                    <button class="search-clear" id="searchClear" style="display: none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Sort Row Removed -->

        </header>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <!-- Home View (Categories Grid) -->
            <div class="view hidden" id="homeView">
                <div class="home-categories-grid" id="homeCategoriesGrid">
                    <!-- Category tiles loaded here -->
                </div>
            </div>

            <!-- Products View (default) -->
            <div class="view" id="productsView">




                <!-- Categories Grid -->
                <div class="categories-grid" id="categoriesGrid"></div>

                <!-- Products Grid -->
                <div class="products-grid" id="productsGrid">
                    <!-- Products loaded here -->
                </div>

                <div class="load-more-container" style="padding: 10px 0;">
                    <button id="loadMoreBtn" class="btn btn-secondary btn-block" style="display: none;"
                        onclick="Catalog.loadMoreProducts()">Показать еще</button>
                </div>

                <!-- Loading -->
                <div class="loading" id="productsLoading" style="display: none;">
                    <div class="spinner"></div>
                </div>

                <!-- No products -->
                <div class="no-products" id="noProducts" style="display: none;">
                    <p>Товары не найдены</p>
                </div>
            </div>

            <!-- Product Detail View (legacy, kept for backward compatibility) -->
            <div class="view hidden" id="productView">
                <button class="back-button" id="productBackBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                    Назад
                </button>
                <div class="product-detail" id="productDetail">
                    <!-- Product detail loaded here -->
                </div>
            </div>

            <!-- Cart View -->
            <div class="view hidden" id="cartView">
                <button class="back-button" id="cartBackBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                    Назад в каталог
                </button>
                <h2 class="view-title">Корзина</h2>
                <div class="cart-items" id="cartItems">
                    <!-- Cart items loaded here -->
                </div>
                <div class="cart-empty" id="cartEmpty" style="display: none;">
                    <div class="cart-empty-icon">🛒</div>
                    <p>Корзина пуста</p>
                    <button class="btn btn-primary" onclick="App.showCatalog()">Перейти в каталог</button>
                </div>
                <div class="cart-footer" id="cartFooter" style="display: none;">
                    <div class="cart-total">
                        <span>Итого:</span>
                        <span class="cart-total-amount" id="cartTotal">0₽</span>
                    </div>
                    <button class="btn btn-primary btn-block" id="checkoutBtn">Оформить заказ</button>
                </div>
            </div>

            <!-- Checkout View -->
            <div class="view hidden" id="checkoutView">
                <button class="back-button" id="checkoutBackBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                    Назад в корзину
                </button>
                <h2 class="view-title">Оформление заказа</h2>
                <form class="checkout-form" id="checkoutForm">
                    <div class="form-group">
                        <label for="customerName">ФИО <span class="required">*</span></label>
                        <input type="text" id="customerName" required placeholder="Фамилия Имя Отчество">
                    </div>
                    <div class="form-group">
                        <label for="customerPhone">Телефон <span class="required">*</span></label>
                        <input type="tel" id="customerPhone" required placeholder="+7 (900) 123-45-67">
                    </div>

                    <div class="form-group">
                        <label for="customerComment">Комментарий к заказу</label>
                        <textarea id="customerComment" placeholder="Дополнительная информация..."></textarea>
                    </div>

                    <div class="checkout-summary" id="checkoutSummary">
                        <!-- Order summary -->
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Подтвердить заказ</button>
                </form>
            </div>

            <!-- Profile View -->
            <div class="view hidden" id="profileView">
                <button class="back-button" id="profileBackBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                    Назад в каталог
                </button>
                <h2 class="view-title">Личный кабинет</h2>

                <!-- Not authorized -->
                <div class="profile-auth" id="profileAuth">
                    <div class="auth-info">
                        <p>Авторизуйтесь через Telegram для сохранения истории заказов</p>
                        <p class="auth-note">Авторизация не обязательна — вы можете оформить заказ и без неё</p>
                    </div>
                    <button class="btn btn-primary btn-block" id="telegramAuthBtn">
                        Авторизоваться через Telegram
                    </button>
                </div>

                <!-- Authorized -->
                <div class="profile-info" id="profileInfo" style="display: none;">
                    <div class="profile-header">
                        <div class="profile-avatar" id="profileAvatar">👤</div>
                        <div class="profile-name" id="profileName">Пользователь</div>
                        <div class="profile-id" id="profileId">ID: —</div>
                    </div>
                    <button class="btn btn-secondary btn-block" id="logoutBtn">Выйти</button>
                </div>

                <!-- Orders History -->
                <div class="orders-section">
                    <h3>История заказов</h3>
                    <div class="orders-list" id="ordersList">
                        <!-- Orders loaded here -->
                    </div>
                    <div class="orders-empty" id="ordersEmpty" style="display: none;">
                        <p>У вас пока нет заказов</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Product Modal -->
        <div class="product-modal" id="productModal">
            <div class="product-modal-backdrop" id="modalBackdrop"></div>
            <div class="product-modal-content">
                <button class="modal-close-btn" id="modalCloseBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                    <span>Закрыть</span>
                </button>
                <button class="modal-cart-btn" id="modalCartBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M9 22C9.55228 22 10 21.5523 10 21C10 20.4477 9.55228 20 9 20C8.44772 20 8 20.4477 8 21C8 21.5523 8.44772 22 9 22Z" />
                        <path
                            d="M20 22C20.5523 22 21 21.5523 21 21C21 20.4477 20.5523 20 20 20C19.4477 20 19 20.4477 19 21C19 21.5523 19.4477 22 20 22Z" />
                        <path
                            d="M1 1H5L7.68 14.39C7.77 14.83 8.02 15.22 8.38 15.5C8.74 15.78 9.19 15.92 9.64 15.9H19.36C19.81 15.92 20.26 15.78 20.62 15.5C20.98 15.22 21.23 14.83 21.32 14.39L23 6H6" />
                    </svg>
                    <span class="cart-badge" id="modalCartBadge" style="display: none;">0</span>
                </button>
                <div class="product-detail" id="modalProductDetail">
                    <!-- Product detail loaded here -->
                </div>
            </div>
        </div>

        <!-- Order Detail Modal -->
        <div class="order-modal" id="orderModal">
            <div class="order-modal-backdrop" id="orderModalBackdrop"></div>
            <div class="order-modal-content">
                <button class="modal-close-btn" id="orderModalCloseBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                    <span>Закрыть</span>
                </button>
                <div class="order-detail" id="orderDetailContent">
                    <!-- Order detail loaded here -->
                </div>
            </div>
        </div>

        <!-- Catalog Menu Modal -->
        <div class="catalog-menu-modal" id="catalogMenuModal">
            <div class="catalog-menu-header">
                <button class="menu-back-btn" id="menuBackBtn" style="display: none;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                </button>
                <h2 class="menu-title" id="menuTitle">Каталог</h2>
                <button class="menu-close-btn" id="menuCloseBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="catalog-menu-content" id="catalogMenuContent">
                <!-- Categories/Subcategories list -->
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav" id="bottomNav">
            <div class="nav-pill">
                <button class="nav-item" id="navHome" data-view="homeView">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </button>
                <button class="nav-item" id="navCart" data-view="cartView">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M9 22C9.55228 22 10 21.5523 10 21C10 20.4477 9.55228 20 9 20C8.44772 20 8 20.4477 8 21C8 21.5523 8.44772 22 9 22Z" />
                        <path
                            d="M20 22C20.5523 22 21 21.5523 21 21C21 20.4477 20.5523 20 20 20C19.4477 20 19 20.4477 19 21C19 21.5523 19.4477 22 20 22Z" />
                        <path
                            d="M1 1H5L7.68 14.39C7.77 14.83 8.02 15.22 8.38 15.5C8.74 15.78 9.19 15.92 9.64 15.9H19.36C19.81 15.92 20.26 15.78 20.62 15.5C20.98 15.22 21.23 14.83 21.32 14.39L23 6H6" />
                    </svg>
                    <span class="nav-badge" id="navCartBadge" style="display: none;">0</span>
                </button>
                <button class="nav-item" id="navProfile" data-view="profileView">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </button>
            </div>
        </nav>

        <!-- Toast -->
        <div class="toast" id="toast"></div>

        <!-- Scroll to top -->
        <button class="scroll-top" id="scrollTop" style="display: none;">↑</button>
    </div>

    <script src="js/api.js?v=10.0"></script>
    <script src="js/cart.js?v=10.0"></script>
    <script src="js/catalog.js?v=10.0"></script>
    <script src="js/app.js?v=10.0"></script>
</body>

</html>
